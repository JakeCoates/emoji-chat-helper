name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN: emoji-chat-helper
  PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v5/bundle.tar.zst
  PACKAGER_SHA256: 5d206634b17c92fcf78c11b871b602832822e2b6d3d199caff734cae8ef6b3f1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - run: chmod +x gradlew && ./gradlew build --no-daemon

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/lint.py

  packager:
    name: Plugin Hub packager
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: runelite/plugin-hub
          path: plugin-hub
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
      - name: Fetch the packager
        run: |
          set -eu
          curl --location --fail --retry 4 --max-time 120 --output bundle.tar.zst "$PACKAGER_URL"
          echo "$PACKAGER_SHA256  bundle.tar.zst" | sha256sum --check
          tar xf bundle.tar.zst
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/
            api/
          key: hub-deps-${{ hashFiles('plugin-hub/runelite.version', 'bundle.tar.zst') }}
      - run: ./prepare.sh
      - name: Add this commit as the hub entry
        run: |
          set -eu
          {
            echo "repository=$REPOSITORY"
            echo "commit=$COMMIT"
          } > "plugin-hub/plugins/$PLUGIN"
          git -C plugin-hub add "plugins/$PLUGIN"
          git -C plugin-hub -c user.name=ci -c user.email=ci@localhost commit -q -m "Test $PLUGIN at $COMMIT"
      - name: Package
        env:
          FORCE_BUILD: ${{ env.PLUGIN }}
          PACKAGE_IS_PR: "true"
        run: |
          COMMAND_TOKEN="$(openssl rand -hex 32)"
          echo "::stop-commands::$COMMAND_TOKEN"
          exec java -XX:+UseParallelGC -cp package.jar net.runelite.pluginhub.packager.Packager
